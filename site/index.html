<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AI Sim Games：可直接在浏览器中游玩的学习型模拟游戏合集。">
  <title>AI Sim Games</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">PLAYABLE LEARNING LAB</p>
      <h1>AI Sim Games</h1>
      <p>把复杂知识变成可以操作、试错和复盘的浏览器游戏。无需安装，选择一个项目即可开始。</p>
    </header>

    <section class="games" aria-labelledby="games-title">
      <h2 id="games-title">选择游戏</h2>
      <div class="grid">
        <article class="card card-music">
          <div class="number" aria-hidden="true">01</div>
          <p class="tag">音乐 · 探索</p>
          <h3>五度环</h3>
          <p>扮演记谱学徒，通过听、拼、补与判断走过六个城区，在操作中理解音阶、对位、和声与曲式。</p>
          <a href="./games/fifths-ring/">开始旅程 <span aria-hidden="true">→</span></a>
        </article>

        <article class="card card-aircraft">
          <div class="number" aria-hidden="true">02</div>
          <p class="tag">制造 · 经营</p>
          <h3>适航</h3>
          <p>在 18 个季度内管理飞机项目，让设计、制造、试验、试飞与取证协同运转，最终完成交付。</p>
          <a href="./games/aircraft-manufacturer/">进入项目 <span aria-hidden="true">→</span></a>
        </article>
      </div>
    </section>
  </main>
  <footer>teatimecode · static games collection</footer>
</body>
</html>
